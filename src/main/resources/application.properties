spring.application.name=Farmacias URB
server.port=8080

# ---- Base de datos (MySQL 8). Las variables de entorno DB_URL, DB_USER y DB_PASSWORD tienen prioridad ----
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/farmacias_urb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Mexico_City&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:1234}

# ---- JPA / Hibernate (el esquema lo crea el script SQL, no Hibernate) ----
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

# ---- Aplicación ----
# Tasa de IVA del punto de venta (0.00 = medicamentos tasa 0%, 0.16 = 16%)
app.iva-tasa=0.00
# SOLO DESARROLLO: reemplaza los hashes de prueba del script SQL por Admin123 / Cajero123 / Cliente123
app.inicializar-passwords=true

# ---- Swagger / OpenAPI ----
# Swagger UI: http://localhost:8080/swagger-ui.html      Documento OpenAPI: http://localhost:8080/v3/api-docs
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.paths-to-match=/api/**
