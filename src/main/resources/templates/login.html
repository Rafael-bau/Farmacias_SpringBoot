<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión · Farmacias URB</title>
    <link href="https://fonts.googleapis.com/css2?family=Alike&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="login-fondo">
    <h1 class="login-titulo">Farmacias URB</h1>

    <form class="login-card" th:action="@{/login}" method="post" autocomplete="on">
        <h2>Log in</h2>
        <div class="alert alert-danger py-2" th:if="${param.error}">Correo o contraseña incorrectos.</div>
        <div class="alert alert-success py-2" th:if="${param.logout}">Cerraste sesión correctamente.</div>
        <input type="text" name="correo" placeholder="Correo Electrónico / Usuario" maxlength="100" required autofocus autocomplete="username">
        <input type="password" name="password" placeholder="Contraseña" maxlength="72" required autocomplete="current-password">
        <button type="submit" class="btn-login">Log in</button>
    </form>
</body>
</html>
