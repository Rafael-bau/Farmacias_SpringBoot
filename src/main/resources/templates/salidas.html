<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Salidas')}"></head>
<body>
<header th:replace="~{fragments/layout :: barra}"></header>
<div class="contenedor-app">
<nav th:replace="~{fragments/layout :: menu('salidas')}"></nav>
<main class="contenido">
<div th:replace="~{fragments/layout :: mensajes}"></div>
<h1 class="titulo-seccion">Salidas</h1>
<p class="text-secondary">Salidas de inventario que no son ventas: merma, productos caducados o ajustes por conteo. Las ventas se consultan en la sección Ventas.</p>
<button type="button" class="btn btn-success mb-3" data-bs-toggle="modal" data-bs-target="#salidaModal">Registrar salida</button>

<div class="tabla-responsive">
    <table class="tabla-urb">
        <thead><tr><th>Medicamento</th><th>Lote</th><th>Cantidad</th><th>Motivo</th><th>Observaciones</th><th>Fecha</th></tr></thead>
        <tbody>
        <tr th:each="s : ${salidas}">
            <td><span th:text="${s.lote.medicamento.nombreComercial}">Medicamento</span><br><small>Registró: <span th:text="${s.usuario.nombre}">Usuario</span></small></td>
            <td th:text="${s.lote.numLote}">Lote</td>
            <td class="text-center" th:text="${s.cantidad}">0</td>
            <td class="text-center" th:text="${s.motivo}">Motivo</td>
            <td th:text="${s.observaciones}">Obs</td>
            <td class="text-center" th:text="${@fmt.fecha(s.fecha)}">fecha</td>
        </tr>
        <tr th:if="${#lists.isEmpty(salidas)}"><td colspan="6" class="vacio">Aún no hay salidas registradas.</td></tr>
        </tbody>
    </table>
</div>

<div class="modal fade" id="salidaModal" tabindex="-1" aria-labelledby="salidaModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="salidaModalLabel">Registrar salida</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <form th:action="@{/salidas/guardar}" method="post">
        <div class="modal-body">
          <div class="mb-3">
            <label for="loteId" class="form-label">Lote</label>
            <select class="form-select" id="loteId" name="loteId" required>
                <option value="">Selecciona un lote</option>
                <option th:each="l : ${lotes}" th:value="${l.id}"
                        th:text="${l.medicamento.nombreComercial} + ' · Lote ' + ${l.numLote} + ' · ' + ${l.stockActual} + ' pzas · cad. ' + ${@fmt.fecha(l.fechaCaducidad)}">Lote</option>
            </select>
          </div>
          <div class="row">
            <div class="col-5 mb-3">
              <label for="cantidad" class="form-label">Cantidad</label>
              <input type="number" class="form-control" id="cantidad" name="cantidad" min="1" step="1" required>
            </div>
            <div class="col-7 mb-3">
              <label for="motivo" class="form-label">Motivo</label>
              <select class="form-select" id="motivo" name="motivo" required>
                  <option value="CADUCIDAD">Caducidad</option>
                  <option value="MERMA">Merma (daño / pérdida)</option>
                  <option value="AJUSTE">Ajuste de inventario</option>
                  <option value="OTRO">Otro</option>
              </select>
            </div>
          </div>
          <div class="mb-3">
            <label for="observaciones" class="form-label">Observaciones (opcional)</label>
            <input type="text" class="form-control" id="observaciones" name="observaciones" maxlength="200">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
          <button type="submit" class="btn btn-primary">Registrar salida</button>
        </div>
      </form>
    </div>
  </div>
</div>
</main>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
