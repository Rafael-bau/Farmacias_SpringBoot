<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Error · Farmacias URB</title>
    <link href="https://fonts.googleapis.com/css2?family=Alike&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
    <div class="pagina-error">
        <h1 th:text="${status != null} ? ${status} : 'Error'">Error</h1>
        <p class="fs-4">Ocurrió un error o no tienes permiso para ver esta página.</p>
        <a class="btn btn-urb" th:href="@{/}">Volver al inicio</a>
    </div>
</body>
</html>
